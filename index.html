<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Technikpult-Anleitungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,600..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ein Technikpult. Startseite = vier Kanalzüge mit Status-LED, Anleitung = Cue-Liste mit Schritt-Karten. */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --surface-2: #f6f7fa;
  --ink: #161a22;
  --muted: #5b6372;
  --line: #d9dde5;
  --ok: #1d8a52;
  --ok-bg: #e5f4ec;
  --proj: #d9560a;
  --stream: #d42a3a;
  --sound: #5146c8;
  --light: #a87400;
  --shadow: 0 1px 2px rgba(22, 26, 34, .06), 0 6px 20px rgba(22, 26, 34, .06);
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #171b22; --surface-2: #1d222b; --ink: #eceff4; --muted: #9aa3b2;
    --line: #2a313c; --ok: #4cc488; --ok-bg: #14271e;
    --proj: #ff8a3d; --stream: #ff5a66; --sound: #a79bff; --light: #f2c14e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #171b22; --surface-2: #1d222b; --ink: #eceff4; --muted: #9aa3b2;
  --line: #2a313c; --ok: #4cc488; --ok-bg: #14271e;
  --proj: #ff8a3d; --stream: #ff5a66; --sound: #a79bff; --light: #f2c14e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

function updateStorageNotice() {
  const note = document.getElementById('storage-note');
  if (!note) return;
  note.classList.toggle('warning', !storagePersistent);
  note.textContent = storagePersistent
    ? 'Dein Fortschritt wird nur in diesem Browser auf diesem Gerät gespeichert. Haken markieren nur deinen persönlichen Fortschritt, keine Geräteprüfung oder Freigabe.'
    : 'Fortschritt wird nur vorübergehend in dieser Sitzung gehalten und nicht dauerhaft gespeichert. Haken markieren keine Geräteprüfung oder Freigabe.';
}

async function copyStepLink(button) {
  const url = new URL(location.href);
  url.hash = `${button.dataset.copyGuide}/step-${button.dataset.copyStep}`;
  let copied = false;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(url.href);
      copied = true;
    }
  } catch {
    copied = false;
  }
  if (!copied) {
    const input = document.createElement('textarea');
    input.value = url.href;
    input.setAttribute('readonly', '');
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.append(input);
    input.select();
    try { copied = document.execCommand('copy'); } catch { copied = false; }
    input.remove();
  }
  button.parentElement.querySelector('.copy-status').textContent = copied
    ? 'Link kopiert.'
    : `Kopieren nicht möglich. Link: ${url.href}`;
}

function searchGuides(query) {
  const normalize = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('de');
  const term = normalize(query.trim());
  if (!term) return [];
  const results = [];
  CATEGORIES.forEach(category => category.guides.forEach(id => {
    const guide = GUIDES[id];
    const guideMatch = normalize(`${category.name} ${guide.title} ${guide.sub}`).includes(term);
    if (guideMatch) results.push({ id, category, guide, step: null });
    let number = 0;
    stepsOf(guide).forEach(step => {
      number++;
      const text = step.d.replace(/<[^>]*>/g, ' ');
      if (normalize(`${step.t} ${text}`).includes(term)) results.push({ id, category, guide, step: { ...step, number } });
    });
  }));
  return results;
}

function renderSearchResults(query) {
  const target = document.getElementById('search-results');
  if (!target) return;
  const q = query.trim();
  if (!q) { target.innerHTML = ''; return; }
  const results = searchGuides(q);
  if (!results.length) {
    target.innerHTML = '<p role="status">Keine passenden Anleitungen oder Schritte gefunden.</p>';
    return;
  }
  target.innerHTML = `<ul class="search-results">${results.map(result => {
    const step = result.step;
    const hash = step ? `${result.id}/step-${step.number}` : result.id;
    const detail = step ? `Schritt ${step.number}: ${esc(step.t)}` : 'Anleitung öffnen';
    return `<li><button class="cat-${result.category.id}" data-go="${hash}"><strong>${esc(result.category.name)} · ${esc(result.guide.title)}</strong><small>${detail}</small></button></li>`;
  }).join('')}</ul>`;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.55 var(--f-body);
}
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; padding-block: 18px 48px; } }

button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--c, var(--proj)); outline-offset: 3px; border-radius: 6px; }

.cat-projektion { --c: var(--proj); }
.cat-stream { --c: var(--stream); }
.cat-sound { --c: var(--sound); }
.cat-light { --c: var(--light); }

/* ---------- Kopfzeile ---------- */
.eyebrow {
  font: 700 12px/1 var(--f-mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(34px, 6vw, 54px); font-weight: 800; font-stretch: 112%; line-height: 1.02; letter-spacing: -.01em; }
h2 { font-size: clamp(22px, 3.4vw, 28px); font-weight: 750; font-stretch: 105%; line-height: 1.15; }
h3 { font-size: 20px; font-weight: 700; line-height: 1.25; }

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 22px; }
.back {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface);
  padding: 7px 14px 7px 10px; border-radius: 999px; cursor: pointer;
  font-weight: 700; font-size: 15px;
}
.back:hover { border-color: var(--muted); }
.back svg { width: 18px; height: 18px; }
.crumbs .sep { color: var(--muted); }
.crumbs .here { color: var(--muted); font-size: 15px; }
@media (max-width: 520px) { .crumbs .sep, .crumbs .here { display: none; } }

/* ---------- Startseite ---------- */
.intro { display: grid; gap: 10px; margin-bottom: 30px; }
.intro p { margin: 0; color: var(--muted); max-width: 52ch; font-size: 18px; }
.search { display: grid; gap: 8px; margin-bottom: 20px; }
.search label { font-weight: 700; }
.search input {
  width: 100%; min-height: 48px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); color: var(--ink); font: inherit;
}
.search-results { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.search-results button {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); text-align: left; cursor: pointer;
}
.search-results button:hover { border-color: var(--c); }
.search-results small { display: block; color: var(--muted); }
.storage-note { margin: 12px 0; color: var(--muted); font-size: 14px; }
.storage-note.warning { padding: 10px 12px; border: 1px solid var(--stream); border-radius: 10px; color: var(--ink); }
.resume-card {
  width: 100%; margin: 0 0 18px; padding: 16px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 14px;
  background: var(--surface); color: var(--ink); text-align: left; cursor: pointer;
  box-shadow: var(--shadow);
}
.resume-card strong { display: block; color: var(--c); }
.resume-card span { font-size: 14px; color: var(--muted); }
.resume-card svg { flex: none; width: 22px; height: 22px; color: var(--c); }

.desk {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 860px) { .desk { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .desk { gap: 10px; } }

.strip {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 18px;
  min-height: 250px;
  padding: 18px 18px 16px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  cursor: pointer;
  overflow: hidden;
  transition: transform .18s ease, border-color .18s ease;
}
.strip::after {
  content: "";
  position: absolute; inset: auto 0 0 0; height: 4px;
  background: var(--c);
  transform: scaleX(.18); transform-origin: left;
  transition: transform .3s ease;
}
.strip:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.strip:hover::after, .strip:focus-visible::after { transform: scaleX(1); }
@media (max-width: 420px) { .strip { min-height: 200px; padding: 14px; gap: 12px; } }
@media (max-width: 420px) { .strip-name { font-size: clamp(20px, 6vw, 24px); } }

.strip-top { display: flex; justify-content: space-between; align-items: center; }
.led {
  display: inline-flex; align-items: center; gap: 7px;
  font: 700 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.led i {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--c);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), 0 0 12px color-mix(in srgb, var(--c) 70%, transparent);
}
.led.off i { background: var(--line); box-shadow: none; }
.strip-icon {
  width: 52px; height: 52px; border-radius: 14px;
  display: grid; place-items: center;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 12%, var(--surface));
}
.strip-icon svg { width: 30px; height: 30px; }
@media (max-width: 420px) { .strip-icon { width: 44px; height: 44px; } .strip-icon svg { width: 26px; height: 26px; } }
.strip-name { font: 800 clamp(24px, 3vw, 30px)/1 var(--f-display); font-stretch: 115%; align-self: end; }
.strip-blurb { color: var(--muted); font-size: 15px; line-height: 1.4; margin-top: 6px; }
.strip-foot {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 12px; border-top: 1px dashed var(--line);
  font: 500 13px/1 var(--f-mono); color: var(--muted);
}
.strip-foot b { color: var(--ink); font-weight: 700; }
.strip-foot svg { width: 18px; height: 18px; color: var(--c); }

/* ---------- Kategorie ---------- */
.cat-head { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.cat-head .strip-icon { width: 64px; height: 64px; flex: none; }
.cat-head .strip-icon svg { width: 36px; height: 36px; }
.cat-head p { margin: 4px 0 0; color: var(--muted); }

.guide-list { display: grid; gap: 12px; }
.guide-card {
  display: grid;
  grid-template-columns: 148px minmax(0, 1fr) auto;
  align-items: center;
  gap: 18px;
  padding: 12px 18px 12px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  text-align: left; cursor: pointer;
  transition: border-color .18s ease, transform .18s ease;
}
.guide-card:hover { border-color: var(--c); transform: translateY(-2px); }
.guide-card img { width: 148px; height: 104px; object-fit: cover; border-radius: 10px; display: block; background: var(--surface-2); }
.guide-card h3 { margin-bottom: 4px; }
.guide-card p { margin: 0; color: var(--muted); font-size: 15px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  font: 500 12px/1 var(--f-mono); padding: 6px 9px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
}
.go { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; }
.go svg { width: 20px; height: 20px; }
@media (max-width: 600px) {
  .guide-card { grid-template-columns: 96px minmax(0, 1fr); padding: 10px; gap: 12px; }
  .guide-card img { width: 96px; height: 96px; }
  .go { display: none; }
}

.empty {
  display: grid; justify-items: start; gap: 10px;
  padding: 28px; border-radius: 16px;
  border: 2px dashed var(--line);
  background: var(--surface);
}
.empty p { margin: 0; color: var(--muted); max-width: 52ch; }

/* ---------- Anleitung ---------- */
.guide-head { display: grid; gap: 10px; margin-bottom: 18px; }
.guide-head .eyebrow { color: var(--c); }
.guide-head p { margin: 0; color: var(--muted); }
.guide-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.guide-actions .btn { padding: 5px 8px; border-color: transparent; background: transparent; font-size: 14px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 15px; text-decoration: none; color: var(--ink); cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn svg { width: 18px; height: 18px; }

.progress {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: -20px; padding: 12px 20px;
  background: var(--bg);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
@media (max-width: 520px) { .progress { margin-inline: -16px; padding: 10px 16px; } }
.progress-row { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--c); border-radius: inherit; transition: width .35s ease; }
.count { font: 700 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.next-step { color: var(--muted); font-size: 14px; font-weight: 700; }
.phases-wrap { position: relative; min-width: 0; }
.phases-wrap::after {
  content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 28px;
  background: linear-gradient(90deg, transparent, var(--bg)); pointer-events: none;
}
.phases { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-right: 24px; }
.phases::-webkit-scrollbar { display: none; }
.phase-btn {
  flex: none; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font: 700 14px/1.2 var(--f-body); white-space: nowrap; cursor: pointer;
}
.phase-btn:hover { border-color: var(--c); color: var(--c); }
.phase-btn.active { border-color: var(--c); background: var(--surface); color: var(--c); }

.phase { margin-top: 34px; scroll-margin-top: 110px; }
.phase-label { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.phase-label .eyebrow { color: var(--c); }
.phase-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.chapter { margin-top: 22px; display: grid; gap: 12px; scroll-margin-top: 110px; }
.chapter > h2 { display: flex; align-items: baseline; gap: 12px; }
.chapter > h2 .num { font: 700 14px/1 var(--f-mono); color: var(--muted); }

.step {
  display: grid;
  grid-template-columns: minmax(0, 46%) minmax(0, 1fr);
  gap: 20px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  transition: border-color .2s ease, opacity .2s ease;
}
.step.done { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.step.done .step-img img { opacity: .55; }
@media (max-width: 720px) { .step { grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 12px; } }

.step-img {
  border: 0; padding: 0; margin: 0; cursor: zoom-in;
  background: var(--surface-2); border-radius: 12px; overflow: hidden;
  display: grid; place-items: center; min-height: 160px; max-height: 300px;
  position: relative; isolation: isolate;
}
.step-img::before {
  content: ""; position: absolute; z-index: 1; inset: 0;
  background: linear-gradient(100deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%);
  background-size: 200% 100%; animation: image-loading 1.4s ease-in-out infinite;
}
.step-img.portrait::after {
  content: ""; position: absolute; z-index: 0; inset: -10px;
  background: var(--step-image) center / cover no-repeat;
  filter: blur(12px) brightness(.45); transform: scale(1.04);
}
.step-img.loaded::before, .step-img.failed::before { display: none; }
.step-img img { position: relative; z-index: 2; display: block; width: 100%; height: 100%; max-height: 300px; object-fit: contain; transition: opacity .2s ease; }
.step-img.failed img { visibility: hidden; }
.photo-frame { min-width: 0; }
.step-imgs .photo-frame { min-width: 0; }
.image-error { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 4px; font-size: 14px; }
.image-error button { min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 700; cursor: pointer; }
.image-error button:hover { border-color: var(--c); }
.step-img .zoom {
  position: absolute; z-index: 3; right: 8px; bottom: 8px;
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: rgba(0, 0, 0, .55); color: #fff;
}
.step-img .zoom svg { width: 16px; height: 16px; }

.step-imgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start; }
.step-imgs .step-img { min-height: 120px; }
.step-media { min-width: 0; }
.img-note { margin: 6px 2px 0; color: var(--muted); font-size: 13px; line-height: 1.35; }

.map { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.map li {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  padding: 8px 12px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 15px;
}
.map li svg { width: 16px; height: 16px; color: var(--c); flex: none; }
.map li b { font-family: var(--f-mono); font-size: 14px; }

.step-body { display: grid; align-content: start; gap: 10px; min-width: 0; }
.step-title { display: flex; align-items: flex-start; gap: 12px; }
.step-no {
  flex: none; min-width: 38px; height: 38px; padding: 0 8px; border-radius: 10px;
  display: grid; place-items: center;
  background: var(--c); color: #fff;
  font: 700 15px/1 var(--f-mono); font-variant-numeric: tabular-nums;
}
.step-no[role="img"] { font-size: 15px; }
.step.done .step-no { background: var(--ok); }
.step-no svg { width: 18px; height: 18px; }
.step-title h3 { padding-top: 6px; }
.step-body p { margin: 0; }
.step-body strong { font-weight: 700; }
.step { scroll-margin-top: 180px; }
.step-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.step-actions .check { margin-top: 4px; }
.copy-link { min-height: 40px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-weight: 700; cursor: pointer; }
.copy-link:hover { border-color: var(--c); }
.copy-status { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

.check {
  justify-self: start; margin-top: 4px;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 14px 8px 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2);
  font-weight: 700; font-size: 15px;
}
.check .box {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted);
  display: grid; place-items: center; color: transparent;
}
.check .box svg { width: 14px; height: 14px; }
.step.done .check { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.step.done .check .box { background: var(--ok); border-color: var(--ok); color: #fff; }

.ready {
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline;
  padding: 12px 16px; border-radius: 12px;
  background: var(--ok-bg); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent);
}
.ready .eyebrow { color: var(--ok); }
.ready span:last-child { font-weight: 700; }

.finish {
  margin-top: 36px; padding: 22px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
}
.finish.is-complete { background: var(--ok-bg); border-color: var(--ok); }
.finish p { margin: 0; color: var(--muted); }
.reset-toast {
  position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 11;
  display: flex; align-items: center; gap: 12px; transform: translateX(-50%);
  max-width: calc(100vw - 24px); padding: 8px 10px 8px 14px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow);
  font-size: 14px; font-weight: 700; white-space: nowrap;
}
.reset-toast button { padding: 6px 10px; border: 0; border-radius: 8px; background: var(--ok-bg); color: var(--ok); font: inherit; cursor: pointer; }

.continue-bar { display: none; }
@media (max-width: 719px) {
  .wrap { padding-bottom: 112px; }
  .continue-bar {
    position: fixed; inset: auto 0 0; z-index: 10;
    display: block; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .continue-bar button {
    width: 100%; min-height: 48px; padding: 10px 14px;
    border: 0; border-radius: 12px; background: var(--c); color: #fff;
    font-weight: 700; cursor: pointer;
  }
  .continue-bar[hidden] { display: none; }
}

.foot { margin-top: 48px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; }

/* ---------- Bild gross ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(8, 10, 14, .92);
  display: grid; grid-template-rows: 1fr auto; gap: 12px;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  cursor: zoom-out;
}
.lightbox img { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
.lightbox p { margin: 0; text-align: center; color: #e9edf3; font-weight: 700; }
.lightbox .close {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
  width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(255, 255, 255, .14); color: #fff; display: grid; place-items: center;
}
.lightbox .close svg { width: 22px; height: 22px; }

.view { animation: rise .28s ease both; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes image-loading { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
  .strip, .guide-card, .strip::after, .bar span { transition: none; }
  .step-img::before { animation: none; }
}
@media print {
  @page { margin: 15mm; }
  body, .wrap { background: #fff; color: #111; }
  .wrap { max-width: none; padding: 0; }
  .crumbs, .guide-actions, .progress, .continue-bar, .reset-toast,
  .check, .copy-link, .copy-status, .zoom, .lightbox, .image-error button { display: none !important; }
  .step, .ready, .finish { break-inside: avoid; box-shadow: none; }
  .step { grid-template-columns: 38% minmax(0, 1fr); border-color: #999; }
  .step-img { min-height: 0; max-height: 100mm; background: #eee; }
  .step-img img { max-height: 100mm; }
  .step-img::before, .step-img::after { display: none !important; }
  .step.done .step-img img { opacity: 1; }
  .photo-frame, .step-media { break-inside: avoid; }
  .phase { margin-top: 10mm; }
  a { color: inherit; }
}

/* ---------- Hilfsfunktionen ---------- */
const $app = document.getElementById('app');
let resetUndo = null;
let resetUndoTimer = 0;
let navObserver = null;
let resumeGuideId = null;
let storagePersistent = true;
const volatileDone = new Map();
try {
  const probe = '__anleitungen_storage_test__';
  localStorage.setItem(probe, '1');
  localStorage.removeItem(probe);
} catch {
  storagePersistent = false;
}
const catById = id => CATEGORIES.find(c => c.id === id);
const stepsOf = g => g.phases.flatMap(p => p.chapters.flatMap(c => c.steps));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

function loadDone(id) {
  try {
    const stored = localStorage.getItem('done:' + id);
    if (stored !== null) {
      const parsed = JSON.parse(stored);
      if (!Array.isArray(parsed)) throw new TypeError('Gespeicherter Fortschritt hat ein unerwartetes Format.');
      volatileDone.set(id, new Set(parsed));
    }
    return new Set(volatileDone.get(id) || []);
  } catch (error) {
    storagePersistent = false;
    if (error instanceof SyntaxError || error instanceof TypeError) console.warn('Fortschritt konnte nicht gelesen werden:', error);
    return new Set(volatileDone.get(id) || []);
  }
}
const preloadedImages = new Set();

function preloadNextSteps() {
  const nextImages = [...$app.querySelectorAll('.step:not(.done)')]
    .slice(0, 2)
    .flatMap(step => [...step.querySelectorAll('.step-img img')])
    .map(img => img.getAttribute('src'));
  nextImages.forEach(src => {
    if (preloadedImages.has(src)) return;
    const link = document.createElement('link');
    link.rel = 'preload';
    link.as = 'image';
    link.href = src;
    document.head.append(link);
    preloadedImages.add(src);
  });
}
function saveDone(id, set) {
  volatileDone.set(id, new Set(set));
  try {
    localStorage.setItem('done:' + id, JSON.stringify([...set]));
  } catch {
    storagePersistent = false;
  }
  updateStorageNotice();
}

function syncGuideSteps() {
  const id = decodeURIComponent(location.hash.slice(1));
  const done = loadDone(id);
  $app.querySelectorAll('.step').forEach(card => {
    const n = Number(card.dataset.step);
    const isDone = done.has(n);
    card.classList.toggle('done', isDone);
    const check = card.querySelector('.check');
    check.setAttribute('aria-pressed', isDone);
    check.setAttribute('aria-label', `Schritt ${n} ${isDone ? 'als nicht erledigt markieren' : 'als erledigt markieren'}`);
    check.querySelector('.lbl').textContent = isDone ? 'Erledigt' : 'Als erledigt markieren';
    const number = card.querySelector('.step-no');
    number.innerHTML = isDone ? TICK : n;
    number.setAttribute('aria-label', isDone ? `Schritt ${n} erledigt` : `Schritt ${n}`);
  });
}

function showResetUndo(id, previous) {
  resetUndo = { id, previous: [...previous] };
  clearTimeout(resetUndoTimer);
  const notice = document.getElementById('reset-toast');
  notice.hidden = false;
  resetUndoTimer = setTimeout(() => {
    resetUndo = null;
    notice.hidden = true;
  }, 5000);
}

function go(hash) {
  if (location.hash.slice(1) === hash) render(); else location.hash = hash;
}

function crumbs(parts) {
  const backTo = parts.length > 1 ? parts[parts.length - 2].hash : '';
  const trail = parts.map(p => `<span class="sep">/</span><span class="here">${esc(p.label)}</span>`).join('');
  return `<nav class="crumbs"><button class="back" data-go="${backTo}">${BACK} Zurück</button>${trail}</nav>`;
}

/* ---------- Ansichten ---------- */
function renderStart() {
  const resume = CATEGORIES.flatMap(c => c.guides.map(id => ({ category: c, id, guide: GUIDES[id], done: loadDone(id) })))
    .map(item => ({ ...item, total: stepsOf(item.guide).length }))
    .find(item => item.done.size > 0 && item.done.size < item.total);
  const resumeCard = resume ? (() => {
    const next = Array.from({ length: resume.total }, (_, i) => i + 1).find(step => !resume.done.has(step));
    return `<button class="resume-card cat-${resume.category.id}" data-go="${resume.id}" data-resume="${resume.id}">
      <span><strong>Weitermachen</strong>Weiter bei ${esc(resume.guide.title)} – Schritt ${next} von ${resume.total}</span>${ARROW}
    </button>`;
  })() : '';
  const strips = CATEGORIES.map(c => {
    const n = c.guides.length;
    const total = c.guides.reduce((sum, id) => sum + stepsOf(GUIDES[id]).length, 0);
    const done = c.guides.reduce((sum, id) => sum + loadDone(id).size, 0);
    return `<button class="strip cat-${c.id}" data-go="${n === 1 ? c.guides[0] : c.id}" aria-label="${esc(c.name)} öffnen">
      <div class="strip-top">
        <span class="strip-icon">${ICONS[c.id]}</span>
        <span class="led ${n ? '' : 'off'}"><i></i>${n ? (done ? `${done}/${total}` : `${total} Schritte`) : 'Bald'}</span>
      </div>
      <div>
        <div class="strip-name">${esc(c.name)}</div>
        <div class="strip-blurb">${esc(c.blurb)}</div>
      </div>
      <div class="strip-foot"><span>${n ? `<b>${n}</b> Anleitung${n > 1 ? 'en' : ''}` : 'Noch leer'}</span>${ARROW}</div>
    </button>`;
  }).join('');
  return `<header class="intro">
      <span class="eyebrow">Technikpult</span>
      <h1>Was machst du heute?</h1>
      <p>Wähle deinen Bereich. Danach siehst du die passende Anleitung Schritt für Schritt mit Fotos.</p>
    </header>
    <div class="search">
      <label for="guide-search">Anleitungen durchsuchen</label>
      <input id="guide-search" type="search" autocomplete="off" placeholder="Bereich, Schritt oder Text">
      <div id="search-results" aria-live="polite"></div>

function renderGuide(id) {

  }).join('');
  const total = n;
  const chapterNames = g.phases.flatMap(p => p.chapters.map(c => c.title));
  const phaseNav = g.phases.length > 1
    ? `<div class="phases-wrap"><div class="phases">${g.phases.map((p, i) => `<button class="phase-btn" data-jump="phase-${i}">${esc(p.short || p.name)}</button>`).join('')}</div></div>`
    : chapterNames.length > 1
      ? `<div class="phases-wrap"><div class="phases">${g.phases.flatMap(p => p.chapters).map((c, i) => `<button class="phase-btn" data-jump="ch-${i + 1}">${esc(c.short || c.title)}</button>`).join('')}</div></div>` : '';

      <div class="guide-actions">
        <a class="btn" href="${g.pdf}" target="_blank" rel="noopener">${DOC} Original-PDF öffnen</a>

      </div>
    </header>
    <div class="progress">
      <div class="progress-row"><div class="bar"><span id="bar"></span></div><span class="count" id="count"></span></div>

function observeNavigation(id) {
  navObserver?.disconnect();
  const guide = GUIDES[id];
  const targets = guide.phases.length > 1
    ? [...$app.querySelectorAll('.phase')]
    : [...$app.querySelectorAll('.chapter')];
  if (!targets.length || !('IntersectionObserver' in window)) return;
  navObserver = new IntersectionObserver(() => {
    const marker = 155;
    const current = targets.find(section => {
      const rect = section.getBoundingClientRect();
      return rect.top <= marker && rect.bottom > marker;
    }) || targets.find(section => section.getBoundingClientRect().top > marker) || targets[targets.length - 1];
    const button = $app.querySelector(`[data-jump="${current.id}"]`);
    $app.querySelectorAll('.phase-btn.active').forEach(active => active.classList.remove('active'));
    if (!button) return;
    button.classList.add('active');
    const phases = button.parentElement;
    const desiredLeft = phases.scrollLeft + button.getBoundingClientRect().left - phases.getBoundingClientRect().left - (phases.clientWidth - button.offsetWidth) / 2;
    phases.scrollTo({ left: desiredLeft, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }, { rootMargin: '-120px 0px -60% 0px' });
  targets.forEach(section => navObserver.observe(section));
}

function updateProgress(id) {
  const total = stepsOf(GUIDES[id]).length;
  const done = loadDone(id).size;
  const bar = document.getElementById('bar');
  if (!bar) return;
  bar.style.width = (done / total * 100) + '%';
  document.getElementById('count').textContent = `${done} / ${total} erledigt`;
  const remaining = [...$app.querySelectorAll('.step:not(.done)')];
  const next = remaining[0];
  const finish = $app.querySelector('.finish');
  const continueBar = document.getElementById('continue-bar');
  const continueButton = continueBar.querySelector('button');
  finish.classList.toggle('is-complete', !next);
  continueBar.hidden = false;
  $app.querySelectorAll('[data-reset]').forEach(button => { button.hidden = done === 0; });
  if (next) {
    const number = next.dataset.step;
    const title = next.querySelector('h3').textContent;
    document.getElementById('next-step').textContent = `Als Nächstes: ${number} · ${title}`;
    continueButton.textContent = `Weiter zu Schritt ${number}: ${title}`;
    continueButton.dataset.targetStep = number;
  } else {
    document.getElementById('next-step').textContent = 'Alle Schritte erledigt';
    continueButton.textContent = 'Geschafft? Abschluss anzeigen';
    delete continueButton.dataset.targetStep;
  }
  preloadNextSteps();
}

function scrollToNextOpen(id) {
  const next = $app.querySelector('.step:not(.done)');
  const target = next || $app.querySelector('.finish');
  target?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}

function render() {
  const route = decodeURIComponent(location.hash.slice(1));
  const stepRoute = route.match(/^([a-z0-9-]+)\/step-(\d+)$/);
  const h = stepRoute ? stepRoute[1] : route;
  const stepNumber = stepRoute ? Number(stepRoute[2]) : 0;
  let html, catId = '';
  if (GUIDES[h] && (!stepNumber || stepNumber <= stepsOf(GUIDES[h]).length)) { html = renderGuide(h); catId = GUIDES[h].cat; }
  else if (catById(h)) { html = renderCategory(catById(h)); catId = h; }
  else html = renderStart();
  $app.className = 'wrap view' + (catId ? ' cat-' + catId : '');
  $app.innerHTML = html;
  void $app.offsetWidth;
  updateStorageNotice();
  if (GUIDES[h]) {
    updateProgress(h);
    observeNavigation(h);
    if (resumeGuideId === h) requestAnimationFrame(() => scrollToNextOpen(h));
  } else {
    navObserver?.disconnect();
  }
  if (resumeGuideId === h) resumeGuideId = null;
  window.scrollTo(0, 0);
  if (stepNumber && GUIDES[h] && stepNumber <= stepsOf(GUIDES[h]).length) {
    requestAnimationFrame(() => document.getElementById(`step-${stepNumber}`)?.scrollIntoView({ block: 'start' }));
  }
}

/* ---------- Bedienung ---------- */
$app.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-toggle],[data-reset],[data-zoom],[data-jump],[data-continue],[data-undo-reset],[data-copy-step],[data-retry-image]');
  if (!t) return;
  const id = decodeURIComponent(location.hash.slice(1));
  if (t.dataset.resume) resumeGuideId = t.dataset.resume;
  if (t.hasAttribute('data-go')) return go(t.dataset.go);
  if (t.dataset.jump) return document.getElementById(t.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (t.hasAttribute('data-retry-image')) {
    const frame = t.closest('.photo-frame');
    const image = frame.querySelector('img');
    const retry = new URL(image.dataset.originalSrc, location.href);
    retry.searchParams.set('retry', Date.now());
    frame.classList.remove('failed');
    frame.querySelector('.step-img').classList.remove('failed');
    frame.querySelector('.step-img').disabled = false;
    frame.querySelector('.image-error').hidden = true;
    image.src = retry.href;
    return;
  }
  if (t.dataset.zoom) return openLightbox(t.dataset.zoom, t.dataset.cap);
  if (t.hasAttribute('data-copy-step')) return copyStepLink(t);
  if (t.hasAttribute('data-continue')) return scrollToNextOpen(id);
  if (t.hasAttribute('data-undo-reset')) {
    if (!resetUndo || resetUndo.id !== id) return;
    saveDone(id, new Set(resetUndo.previous));
    resetUndo = null;
    clearTimeout(resetUndoTimer);
    document.getElementById('reset-toast').hidden = true;
    syncGuideSteps();
    updateProgress(id);
    return;
  }
  if (t.dataset.toggle) {
    const n = Number(t.dataset.toggle);
    const set = loadDone(id);
    set.has(n) ? set.delete(n) : set.add(n);
    saveDone(id, set);
    const card = t.closest('.step');
    const on = set.has(n);
    card.classList.toggle('done', on);
    t.setAttribute('aria-pressed', on);
    t.setAttribute('aria-label', `Schritt ${n} ${on ? 'als nicht erledigt markieren' : 'als erledigt markieren'}`);
    t.querySelector('.lbl').textContent = on ? 'Erledigt' : 'Als erledigt markieren';
    const number = card.querySelector('.step-no');
    number.innerHTML = on ? TICK : n;
    number.setAttribute('aria-label', on ? `Schritt ${n} erledigt` : `Schritt ${n}`);
    updateProgress(id);
    if (on) requestAnimationFrame(() => scrollToNextOpen(id));
    return;
  }
  if (t.hasAttribute('data-reset')) {
    const previous = loadDone(id);
    saveDone(id, new Set());
    syncGuideSteps();
    updateProgress(id);
    showResetUndo(id, previous);
  }
});
$app.addEventListener('input', e => {
  if (e.target.id === 'guide-search') renderSearchResults(e.target.value);
});
$app.addEventListener('load', e => {
  if (e.target.matches('.step-img img') && e.target.naturalWidth) {
    const frame = e.target.closest('.photo-frame');
    frame.classList.remove('failed');
    frame.querySelector('.step-img').classList.add('loaded');
  }
}, true);
$app.addEventListener('error', e => {
  if (e.target.matches('.step-img img')) {
    const frame = e.target.closest('.photo-frame');
    frame.classList.add('failed');
    frame.querySelector('.step-img').classList.add('failed');
    frame.querySelector('.step-img').disabled = true;
    frame.querySelector('.image-error').hidden = false;
  }
}, true);

const lb = document.getElementById('lightbox');
let lightboxTrigger = null;
function openLightbox(src, cap) {
  lightboxTrigger = document.activeElement;
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-img').alt = cap ? `Vergrössertes Foto: ${cap}` : 'Vergrössertes Anleitungsfoto';
  document.getElementById('lb-cap').textContent = cap || '';
  lb.hidden = false;
  $app.inert = true;
  document.getElementById('lb-close').focus();
}
function closeLightbox() {
  lb.hidden = true;
  $app.inert = false;
  lightboxTrigger?.focus();
  lightboxTrigger = null;
}
lb.addEventListener('click', e => {
  if (e.target === lb || e.target.closest('#lb-close')) closeLightbox();
});
document.addEventListener('keydown', e => {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'Tab') {
    e.preventDefault();
    document.getElementById('lb-close').focus();
  }
});

window.addEventListener('beforeprint', () => {
  $app.querySelectorAll('img[loading="lazy"]').forEach(image => { image.loading = 'eager'; });
});
window.addEventListener('hashchange', render);
render();
</script>
